name: 負けて強し・展開不利 次走実測

on:
  pull_request:
    paths:
      - "historical_pipeline/next_start_lose_strong_analysis.py"
      - ".github/workflows/keirin-next-start-lose-strong.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r historical_pipeline/requirements-historical.txt
      - name: 保存済みデータ取得
        run: |
          mkdir -p train external
          gh release download keirin-data-2025 --pattern keirin_2025_dataset.zip
          gh release download keirin-pr31-frozen-2026-01-02 --pattern keirin_2026_01_02_dataset.zip
          unzip -q keirin_2025_dataset.zip -d train_unpack
          unzip -q keirin_2026_01_02_dataset.zip -d external_unpack
          cp -R train_unpack/dataset/. train/
          cp -R external_unpack/dataset_2026/. external/
      - name: 前走パターンから次走成績を実測
        shell: bash
        run: |
          set -o pipefail
          python historical_pipeline/next_start_lose_strong_analysis.py \
            --train-dir train --external-dir external --output-dir next_start_analysis \
            | tee next_start_analysis.log
      - name: 結果表示
        if: always()
        run: |
          cat next_start_analysis/next_start_report.json 2>/dev/null || true
          cat next_start_analysis/next_start_pattern_classification.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keirin-next-start-lose-strong
          path: |
            next_start_analysis
            next_start_analysis.log
          retention-days: 30
