name: Production PR31 smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-pr31-smoke.yml"
      - "app/**"
      - "individual_api/**"
      - "Dockerfile"
      - "render.yaml"
  pull_request:
    paths:
      - ".github/workflows/production-pr31-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_URL: https://shogo-keirin-os.onrender.com
  SHOGO_ACCESS_PIN: ${{ secrets.SHOGO_ACCESS_PIN }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render本番health確認
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --connect-timeout 10 --max-time 30 "$PROD_URL/health" -o health.json; then
              if python - <<'PY'
import json
x=json.load(open('health.json', encoding='utf-8'))
assert x.get('status') == 'ok', x
assert x.get('engine') == 'PR31_FROZEN_ONLY', x
assert x.get('purchase_points') == '3_to_5_or_no_bet', x
assert x.get('prediction_inputs') == 'KEIRIN_JP_3PDF_ONLY', x
assert x.get('previous_day_features') == 'removed', x
assert x.get('external_web_lookup') == 'disabled', x
assert x.get('ui_upload_mode') == 'fixed_roles_v1', x
print(json.dumps(x, ensure_ascii=False))
PY
              then
                ok=1
                break
              fi
            fi
            sleep 15
          done
          test "$ok" -eq 1

      - name: 本番UI確認
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --connect-timeout 10 --max-time 30 "$PROD_URL/" -o index.html; then
              if grep -q '① 基本情報PDF' index.html \
                && grep -q '② H/S・着度数PDF' index.html \
                && grep -q '③ 2車単オッズPDF' index.html \
                && grep -q 'PR31' index.html \
                && grep -q '競輪.jpの3PDFのみで計算' index.html \
                && ! grep -q '負けて強し' index.html \
                && ! grep -q '展開不利' index.html; then
                ok=1
                break
              fi
            fi
            sleep 15
          done
          test "$ok" -eq 1

      - name: 実3PDFを本番UI経路へ投入
        shell: bash
        run: |
          set -euo pipefail
          root='tests/fixtures/keirin_jp/2026-08-03_odawara_4r'
          basic="$root/レース情報｜KEIRIN(71).PDF"
          hs="$root/レース情報｜KEIRIN(72).PDF"
          odds="$root/オッズ｜KEIRIN(11).PDF"
          ok=0
          for i in $(seq 1 20); do
            started=$(date +%s)
            code=$(curl -sS --connect-timeout 10 --max-time 120 \
              -o response.json -w '%{http_code}' \
              -F "basic_pdf=@$basic;type=application/pdf" \
              -F "hs_pdf=@$hs;type=application/pdf" \
              -F "odds_pdf=@$odds;type=application/pdf" \
              -F "pin=$SHOGO_ACCESS_PIN" \
              "$PROD_URL/analyze" || true)
            elapsed=$(( $(date +%s) - started ))
            echo "attempt=$i HTTP_CODE=$code elapsed=${elapsed}s"
            if [ "$code" = "200" ]; then
              if python - <<'PY'
import json
x=json.load(open('response.json', encoding='utf-8'))
assert x.get('status') == 'OK', x
assert x.get('engine') == 'PR31_FROZEN_ONLY', x
assert x.get('purchase_status') in {'BET','NO_BET'}, x
assert len(x.get('pair_ranking', [])) > 0, x
assert 'previous_day' not in x, x
assert x.get('pdf_audit', {}).get('selection_method') == 'real_named_parse', x
assert x.get('pdf_audit', {}).get('web_data_used') is False, x
assert x.get('pdf_audit', {}).get('rider_count') == 9, x
assert x.get('pdf_audit', {}).get('odds_count') == 72, x
print(json.dumps({
  'engine': x['engine'],
  'purchase_status': x['purchase_status'],
  'day_no': x.get('race',{}).get('day_no'),
  'pair_count': len(x.get('pair_ranking',[])),
  'rider_count': x.get('pdf_audit',{}).get('rider_count'),
  'odds_count': x.get('pdf_audit',{}).get('odds_count'),
  'previous_day_present': 'previous_day' in x,
}, ensure_ascii=False))
PY
              then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo 'production /analyze smoke failed'
            cat response.json || true
          fi
          test "$ok" -eq 1
