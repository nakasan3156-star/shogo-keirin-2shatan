name: KEIRIN Resilient PDF CI

on:
  pull_request:
    paths:
      - ".github/workflows/keirin-5pdf-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_URL: https://shogo-keirin-os.onrender.com
  SHOGO_ACCESS_PIN: ${{ secrets.SHOGO_ACCESS_PIN }}

jobs:
  production-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render本番fail-open v3反映待ち
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --connect-timeout 10 --max-time 30 "$PROD_URL/health" -o health.json; then
              if python - <<'PY'
import json
x=json.load(open('health.json', encoding='utf-8'))
assert x.get('status') == 'ok', x
assert x.get('engine') == 'PR31_FROZEN_ONLY', x
assert x.get('ui_upload_mode') == 'fixed_roles_v1', x
assert x.get('lineup_resolver') == 'resilient_v1', x
assert x.get('previous_day_resolver') == 'fail_open_v3', x
assert x.get('current_race_result_page') == 'forbidden', x
assert x.get('purchase_points') == '3_to_5_or_no_bet', x
print(json.dumps(x, ensure_ascii=False))
PY
              then
                ok=1
                break
              fi
            fi
            sleep 15
          done
          test "$ok" -eq 1

      - name: 本番3枠UI確認
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 "$PROD_URL/" -o index.html
          grep -q '① 基本情報PDF' index.html
          grep -q '② H/S・着度数PDF' index.html
          grep -q '③ 2車単オッズPDF' index.html
          grep -q '自動でもう一度試しています' index.html
          grep -q '前日情報なし（PR31単体で計算）' index.html
          ! grep -q 'A方式・C方式：撤廃' index.html

      - name: 実KEIRIN.JP 3PDF本番POST
        shell: bash
        run: |
          set -euo pipefail
          root='tests/fixtures/keirin_jp/2026-08-03_odawara_4r'
          basic="$root/レース情報｜KEIRIN(71).PDF"
          hs="$root/レース情報｜KEIRIN(72).PDF"
          odds="$root/オッズ｜KEIRIN(11).PDF"
          ok=0
          for i in $(seq 1 20); do
            started=$(date +%s)
            code=$(curl -sS --connect-timeout 10 --max-time 120 \
              -o response.json -w '%{http_code}' \
              -F "basic_pdf=@$basic;type=application/pdf" \
              -F "hs_pdf=@$hs;type=application/pdf" \
              -F "odds_pdf=@$odds;type=application/pdf" \
              -F "pin=$SHOGO_ACCESS_PIN" \
              "$PROD_URL/analyze" || true)
            elapsed=$(( $(date +%s) - started ))
            echo "attempt=$i HTTP_CODE=$code elapsed=${elapsed}s"
            if [ "$code" = "403" ]; then
              echo '本番はPIN保護中。GitHub側PIN未設定のためPOSTをスキップ。'
              exit 0
            fi
            if [ "$code" = "200" ]; then
              if python - <<'PY'
import json
x=json.load(open('response.json', encoding='utf-8'))
assert x.get('status') == 'OK', x
assert x.get('engine') == 'PR31_FROZEN_ONLY', x
assert x.get('purchase_status') in {'BET','NO_BET'}, x
assert len(x.get('pair_ranking', [])) > 0, x
assert x.get('pdf_audit', {}).get('selection_method') == 'real_named_parse', x
assert x.get('pdf_audit', {}).get('rider_count') == 9, x
assert x.get('pdf_audit', {}).get('odds_count') == 72, x
assert x.get('previous_day', {}).get('status') != 'PREVIOUS_DAY_TIMEOUT', x
print(json.dumps({
  'engine': x['engine'],
  'purchase_status': x['purchase_status'],
  'day_no': x.get('race',{}).get('day_no'),
  'pair_count': len(x.get('pair_ranking',[])),
  'selection_method': x.get('pdf_audit',{}).get('selection_method'),
  'rider_count': x.get('pdf_audit',{}).get('rider_count'),
  'odds_count': x.get('pdf_audit',{}).get('odds_count'),
  'previous_day_status': x.get('previous_day',{}).get('status'),
}, ensure_ascii=False))
PY
              then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" -eq 1
