name: KEIRIN Resilient PDF CI

on:
  pull_request:
    paths:
      - "app/**"
      - "individual_api/**"
      - "historical_pipeline/chatgpt_baseline_backtest.py"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/keirin-5pdf-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PDF engine
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - name: PR31 Frozenモデル取得
        run: |
          mkdir -p individual_api/models
          url="https://github.com/nakasan3156-star/shogo-keirin-2shatan/releases/download/pr31-runtime-v1/pr31_frozen.joblib"
          for attempt in $(seq 1 20); do
            if curl -fsSL "$url" -o individual_api/models/pr31_frozen.joblib; then
              break
            fi
            rm -f individual_api/models/pr31_frozen.joblib
            sleep 15
          done
          test -s individual_api/models/pr31_frozen.joblib
          echo "6aaaa9f1ce13db1e86b91b377997a8580be82948381d69097839a9b5673490e6  individual_api/models/pr31_frozen.joblib" | sha256sum -c -
      - name: Compile
        run: python -m compileall -q app individual_api historical_pipeline
      - name: Regression tests
        env:
          PYTHONPATH: .:individual_api
        run: pytest -q
      - name: FastAPI smoke test
        env:
          PYTHONPATH: .:individual_api
        run: |
          python - <<'PY'
          from app.main import health
          result = health()
          assert result["status"] == "ok"
          assert result["engine"] == "PR31_FROZEN_ONLY"
          assert result["a_strategy"] == "removed"
          assert result["c_strategy"] == "removed"
          assert result["selection_method"] == "PR31_probability_then_conditional_exacta_then_calibration_then_EV"
          assert result["previous_day"] == "day2_or_later_only_KDreams_best_effort"
          assert result["first_day"] == "no_previous_day_adjustment"
          assert result["purchase_points"] == "3_to_5_or_no_bet"
          print(result)
          PY
