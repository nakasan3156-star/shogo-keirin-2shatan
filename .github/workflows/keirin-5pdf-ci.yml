name: KEIRIN Resilient PDF CI

on:
  pull_request:
    paths:
      - "app/**"
      - "individual_api/**"
      - ".github/workflows/keirin-5pdf-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app individual_api
      - name: Regression tests
        env:
          PYTHONPATH: .:individual_api
        run: pytest -q
      - name: FastAPI smoke test
        env:
          PYTHONPATH: .:individual_api
        run: |
          python - <<'PY'
          from app.main import health
          result = health()
          assert result["status"] == "ok"
          assert result["model_status"] == "keirin_jp_resilient_pdf_parse"
          assert result["selection_method"] == "real_full_parse_with_safe_fallbacks"
          assert result["closed_odds"] == "allowed"
          assert result["active_missing_lines"] == "safe_stop_after_resilient_retry"
          assert result["upload_mode"] == "multiple_pdfs_auto_detect"
          assert len(result["required_roles"]) == 3
          assert result["strategies"]["shogo"] == 5
          assert result["strategies"]["residual"] == 3
          assert result["c_simulations"] == 100000
          print(result)
          PY
