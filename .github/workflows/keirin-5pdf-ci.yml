name: KEIRIN Resilient PDF CI

on:
  pull_request:
    paths:
      - ".github/workflows/keirin-5pdf-ci.yml"
      - "tests/ops_502_diag_trigger.txt"

permissions:
  contents: read

env:
  PROD_URL: https://shogo-keirin-os.onrender.com
  SHOGO_ACCESS_PIN: ${{ secrets.SHOGO_ACCESS_PIN }}

jobs:
  diagnose-third-502:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 連続POSTと502直後health診断
        shell: bash
        run: |
          set -u
          root='tests/fixtures/keirin_jp/2026-08-03_odawara_4r'
          basic="$root/レース情報｜KEIRIN(71).PDF"
          hs="$root/レース情報｜KEIRIN(72).PDF"
          odds="$root/オッズ｜KEIRIN(11).PDF"
          for i in 1 2 3; do
            started=$(date +%s)
            code=$(curl -sS --connect-timeout 10 --max-time 120 \
              -o "response-$i.json" -w '%{http_code}' \
              -F "basic_pdf=@$basic;type=application/pdf" \
              -F "hs_pdf=@$hs;type=application/pdf" \
              -F "odds_pdf=@$odds;type=application/pdf" \
              -F "pin=$SHOGO_ACCESS_PIN" \
              "$PROD_URL/analyze" || true)
            elapsed=$(( $(date +%s) - started ))
            echo "run=$i code=$code elapsed=${elapsed}s"
            hcode=$(curl -sS --connect-timeout 5 --max-time 15 -o "health-$i.json" -w '%{http_code}' "$PROD_URL/health" || true)
            echo "health_after_run=$i code=$hcode"
            if [ -f "health-$i.json" ]; then cat "health-$i.json"; echo; fi
            if [ "$code" != "200" ]; then
              sleep 3
              started2=$(date +%s)
              retry=$(curl -sS --connect-timeout 10 --max-time 120 \
                -o "retry-$i.json" -w '%{http_code}' \
                -F "basic_pdf=@$basic;type=application/pdf" \
                -F "hs_pdf=@$hs;type=application/pdf" \
                -F "odds_pdf=@$odds;type=application/pdf" \
                -F "pin=$SHOGO_ACCESS_PIN" \
                "$PROD_URL/analyze" || true)
              elapsed2=$(( $(date +%s) - started2 ))
              echo "retry_run=$i code=$retry elapsed=${elapsed2}s"
              hcode2=$(curl -sS --connect-timeout 5 --max-time 15 -o "health-retry-$i.json" -w '%{http_code}' "$PROD_URL/health" || true)
              echo "health_after_retry=$i code=$hcode2"
            fi
          done
          exit 0
