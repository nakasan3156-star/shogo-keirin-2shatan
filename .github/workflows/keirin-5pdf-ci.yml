name: KEIRIN Resilient PDF CI

on:
  pull_request:
    paths:
      - ".github/workflows/keirin-5pdf-ci.yml"
      - "tests/ops_prod_speed_trigger.txt"

permissions:
  contents: read

env:
  PROD_URL: https://shogo-keirin-os.onrender.com
  SHOGO_ACCESS_PIN: ${{ secrets.SHOGO_ACCESS_PIN }}

jobs:
  production-speed-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 新fast path本番反映＋実3PDF確認
        shell: bash
        run: |
          set -euo pipefail
          root='tests/fixtures/keirin_jp/2026-08-03_odawara_4r'
          basic="$root/レース情報｜KEIRIN(71).PDF"
          hs="$root/レース情報｜KEIRIN(72).PDF"
          odds="$root/オッズ｜KEIRIN(11).PDF"
          ok=0
          for i in $(seq 1 30); do
            started=$(date +%s)
            code=$(curl -sS --connect-timeout 10 --max-time 120 \
              -o response.json -w '%{http_code}' \
              -F "basic_pdf=@$basic;type=application/pdf" \
              -F "hs_pdf=@$hs;type=application/pdf" \
              -F "odds_pdf=@$odds;type=application/pdf" \
              -F "pin=$SHOGO_ACCESS_PIN" \
              "$PROD_URL/analyze" || true)
            elapsed=$(( $(date +%s) - started ))
            echo "attempt=$i HTTP_CODE=$code elapsed=${elapsed}s"
            if [ "$code" = "403" ]; then exit 0; fi
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          import json
          x=json.load(open('response.json', encoding='utf-8'))
          assert x.get('status') == 'OK', x
          assert x.get('engine') == 'PR31_FROZEN_ONLY', x
          assert x.get('pdf_audit',{}).get('selection_method') == 'real_named_parse', x
          assert x.get('pdf_audit',{}).get('line_method','').startswith('fixed_odds_fast_v2:'), x
          assert x.get('pdf_audit',{}).get('rider_count') == 9, x
          assert x.get('pdf_audit',{}).get('odds_count') == 72, x
          assert x.get('previous_day',{}).get('status') != 'PREVIOUS_DAY_TIMEOUT', x
          assert len(x.get('pair_ranking',[])) > 0, x
          print(json.dumps({
            'engine':x['engine'],
            'purchase_status':x['purchase_status'],
            'pair_count':len(x.get('pair_ranking',[])),
            'line_method':x.get('pdf_audit',{}).get('line_method'),
            'rider_count':x.get('pdf_audit',{}).get('rider_count'),
            'odds_count':x.get('pdf_audit',{}).get('odds_count'),
            'previous_day_status':x.get('previous_day',{}).get('status')
          },ensure_ascii=False))
          PY
              then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" -eq 1
